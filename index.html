<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Social Link Profile</title>
</head>
<body>
    <main class="main-content">
        <div class="card-social-link">
            <img src="assets/images/avatar-jessica.jpeg" alt="" class="profile-image">
            <div class="basic-informations">
                <h1 class="name">Jessica Randall</h1>
                <h2 class="localization">London, United Kingdom</h2>
            </div>
            <p class="job">"Front-end developer and avid reader."</p>
            <div class="card-links">
                <a rel="noopener noreferrer" href="https://github.com/" target="_blank" class="link">GitHub</a>
                <a rel="noopener noreferrer" href="https://www.frontendmentor.io/" target="_blank" class="link">Frontend Mentor</a>
                <a rel="noopener noreferrer" href="https://www.linkedin.com/" target="_blank" class="link">LinkedIn</a>
                <a rel="noopener noreferrer" href="https://twitter.com/" target="_blank" class="link">Twitter</a>
                <a rel="noopener noreferrer" href="https://www.instagram.com/" target="_blank" class="link">Instagram</a>
            </div>
        </div>
    </main>
</body>
</html>
